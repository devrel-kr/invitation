name: GitHub organization onboarding request
description: Issue template for requesting onboarding to a GitHub organization.

title: "[GitHub organization onboarding request] "

labels:
  - onboarding
  - request

body:
  - type: markdown
    attributes:
      value: |
        <br/>
        Welcome! Please fill in the form below to request onboarding to the GitHub organization.

        ### Before you request

        The account you enter must be a **personal** GitHub account that does **not** already have a GitHub Copilot license attached to it.

        Scan the QR code below &mdash; or open [github.com/settings/copilot/features](https://github.com/settings/copilot/features) directly &mdash; to check whether the account you are currently signed in with already has a GitHub Copilot license.

        <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-check.png" alt="QR code linking to the GitHub Copilot settings page" width="200" />

        After opening that page, scroll down. You should see one of the three screens below. If you see anything else, your account already has a Copilot license attached and you will need a different GitHub account.

        <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-no-ghcp.jpg" alt="No GitHub Copilot license attached" width="200" /> <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-free-1.jpg" alt="GitHub Copilot Free example 1" width="200" /> <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-free-2.jpg" alt="GitHub Copilot Free example 2" width="200" />

  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      options:
        - GitHub organization onboarding request
    validations:
      required: true

  - type: dropdown
    id: organization
    attributes:
      label: Organization
      options:
        - {{ORG_NAME}}
    validations:
      required: true

  - type: input
    id: github-handle
    attributes:
      label: GitHub Handle
      description: Enter your GitHub username without the `@` symbol.
      placeholder: octocat
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Confirmation
      options:
        - label: The GitHub handle I entered is my own account.
          required: true

  - type: markdown
    attributes:
      value: |
        <br/>
        When the onboarding workflow processes your request, GitHub will notify you with steps to join the organization. Complete those steps to gain access. Thank you!

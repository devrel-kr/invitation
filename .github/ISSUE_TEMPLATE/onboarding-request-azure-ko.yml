name: Azure 구독 온보딩 요청

description: Azure 구독에 온보딩을 요청하기 위한 이슈 템플릿입니다.

title: "[Azure 구독 온보딩 요청] "

labels:
  - onboarding
  - request

body:
  - type: markdown
    attributes:
      value: |
        <br/>
        환영합니다! Azure 구독 온보딩을 요청하기 위해 아래 양식을 작성해주세요.

  - type: dropdown
    id: request-type
    attributes:
      label: 요청 유형
      options:
        - Azure 구독 온보딩 요청
    validations:
      required: true

  - type: dropdown
    id: organization
    attributes:
      label: 조직
      options:
        - {{ENTRA_TENANT_DOMAIN_NAME}}
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: 이름
      placeholder: 김개발
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: 이메일
      placeholder: kgaebal@gmail.com (gmail.com, outlook.com, outlook.kr, hotmail.com, naver.com, kakao.com 중 개인 이메일을 사용하세요. 회사 이메일은 사용할 수 없습니다.)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <br/>
        온보딩 워크플로에서 요청을 처리하면 Azure가 제공하신 이메일 주소로 구독 가입 링크를 보냅니다. 링크를 열어 안내된 절차를 완료하면 구독에 접근할 수 있습니다. 감사합니다!

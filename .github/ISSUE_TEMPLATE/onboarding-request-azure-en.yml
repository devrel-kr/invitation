name: Azure subscription onboarding request

description: Issue template for requesting onboarding to an Azure subscription.

title: "[Azure subscription onboarding request] "

labels:
  - invitation
  - request

body:
  - type: markdown
    attributes:
      value: |
        <br/>
        Welcome! Please complete the form below to request an Azure subscription invitation.

  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      options:
        - Azure subscription onboarding request
    validations:
      required: true

  - type: dropdown
    id: organization
    attributes:
      label: Organization
      options:
        - {{ENTRA_TENANT_DOMAIN_NAME}}
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Developer
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email
      placeholder: jane.developer@gmail.com (use a personal email such as gmail.com or outlook.com, not a work email)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <br/>
        When you submit the request, an Azure subscription invitation will be sent to the email address you provide. After accepting the invitation, you can join the subscription.

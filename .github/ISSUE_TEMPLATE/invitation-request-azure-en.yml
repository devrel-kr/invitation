name: Azure subscription invitation request

description: Issue template for requesting access to an Azure subscription.

title: "[Azure subscription invitation request] "

labels:
  - invitation
  - request

body:
  - type: markdown
    attributes:
      value: |
        <br/>
        Welcome! Please complete the form below to request an Azure subscription invitation.

  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      options:
        - Azure subscription invitation request
    validations:
      required: true

  - type: dropdown
    id: organization
    attributes:
      label: Organization
      options:
        - devrelkorea.org
    validations:
      required: true

  - type: input
    id: github-profile-link
    attributes:
      label: GitHub Profile Link
      placeholder: https://github.com/octocat
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Developer
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email
      placeholder: jane.developer@gmail.com (use a personal email such as Gmail, Outlook, or Naver)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <br/>
        When you submit the request, an Azure subscription invitation will be sent to the email address you provide. After accepting the invitation, you can join the subscription.

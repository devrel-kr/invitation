name: GitHub 조직 온보딩 요청
description: GitHub 조직에 온보딩을 요청하기 위한 이슈 템플릿입니다.

title: "[GitHub 조직 온보딩 요청] "

labels:
  - onboarding
  - request

body:
  - type: markdown
    attributes:
      value: |
        <br/>
        환영합니다! GitHub 조직 온보딩을 요청하기 위해 아래 양식을 작성해주세요.

        ### 요청 전 확인 사항

        입력하는 계정은 반드시 **개인** GitHub 계정이어야 하며, 해당 계정에 현재 어떤 GitHub Copilot 라이선스도 연결되어 있지 않아야 합니다.

        아래 QR 코드를 스캔하거나 [github.com/settings/copilot/features](https://github.com/settings/copilot/features) 페이지를 직접 열면, 현재 로그인한 계정에 GitHub Copilot 라이선스가 연결되어 있는지 확인할 수 있습니다.

        <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-check.png" alt="GitHub Copilot 설정 페이지로 연결되는 QR 코드" width="200" />

        해당 페이지를 연 뒤 화면을 아래로 스크롤하면 다음 세 가지 중 하나처럼 보여야 합니다. 그렇지 않다면 이미 Copilot 라이선스가 연결된 계정이므로, 다른 GitHub 계정이 필요합니다.

        <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-no-ghcp.jpg" alt="GitHub Copilot 라이선스 없음" width="200" /> <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-free-1.jpg" alt="GitHub Copilot 무료 라이선스 예시 1" width="200" /> <img src="https://raw.githubusercontent.com/{{ORG_NAME}}/{{REPOSITORY_NAME}}/main/images/ghcp-free-2.jpg" alt="GitHub Copilot 무료 라이선스 예시 2" width="200" />

  - type: dropdown
    id: request-type
    attributes:
      label: 요청 유형
      options:
        - GitHub 조직 온보딩 요청
    validations:
      required: true

  - type: dropdown
    id: organization
    attributes:
      label: 조직
      options:
        - "{{ORG_NAME}}"
    validations:
      required: true

  - type: input
    id: github-handle
    attributes:
      label: GitHub 핸들
      description: 이슈를 작성하는 본인의 GitHub 계정 이름을 `@` 없이 입력해 주세요.
      placeholder: octocat
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 확인 사항
      options:
        - label: 입력한 GitHub 핸들은 이슈를 작성하는 본인의 계정입니다.
          required: true

  - type: markdown
    attributes:
      value: |
        <br/>
        온보딩 워크플로에서 요청을 처리하면 GitHub 알림으로 조직 가입 절차를 안내해 드립니다. 안내된 절차를 완료하면 조직에 접근할 수 있습니다. 감사합니다!

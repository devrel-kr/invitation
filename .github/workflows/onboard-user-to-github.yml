name: "Workflow: User Onboarding to GitHub Organization"

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  onboard_user:
    name: "Onboard User to GitHub Organization"

    if: |
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[GitHub organization onboarding request]') ||
      startsWith(github.event.issue.title, '[GitHub 조직 온보딩 요청]'))

    runs-on: ubuntu-latest

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-members: write

      - name: Check event payload - from issue
        if: |
          github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          ISSUE_PAYLOAD: ${{ toJson(github.event.issue) }}
        run: |
          printf '%s' "$ISSUE_PAYLOAD" > "${{ github.workspace }}/payload.json"

      - name: Check event payload - from workflow_dispatch
        if: |
          github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.inputs.issue-number }}" \
            > "${{ github.workspace }}/payload.json"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate GitHub organization request
        id: issue
        shell: bash
        env:
          DUE_DATE: ${{ vars.ONBOARDING_DUE_DATE }}
          EXPECTED_ORGANIZATION: ${{ github.repository_owner }}
        run: |
          dotnet run --file ./scripts/Validate-OnboardingRequest.cs -- \
            --request-type github \
            --input "${{ github.workspace }}/payload.json" \
            --output "${{ github.workspace }}/issue.json" \
            --due-date "$DUE_DATE" \
            --organization "$EXPECTED_ORGANIZATION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Comment to issue - Acknowledge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issueNumber }}
          COMMENT_BODY: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}!

            We have received your GitHub organization onboarding request and are reviewing it.
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "$GITHUB_REPOSITORY"

          for reaction in '+1' rocket; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/reactions" \
              -f content="$reaction" > /dev/null
          done

      - name: Add label - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
            --add-label "invalid" \
            -R ${{ github.event.repository.full_name }}

      - name: Comment to issue - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issueNumber }}
          COMMENT_BODY: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}!

            - Submitted at: ${{ steps.issue.outputs.submittedAt }}
            - Due by: ${{ steps.issue.outputs.dueBy }}

            Your GitHub organization onboarding request is not valid for the following reasons:

            ${{ steps.issue.outputs.invalidReasons }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "$GITHUB_REPOSITORY"

      - name: Close issue - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue close ${{ steps.issue.outputs.issueNumber }} \
            -c "The submitted request is invalid. Closing this issue." \
            -R ${{ github.event.repository.full_name }}

      - name: Onboard user to GitHub organization
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ORGANIZATION: ${{ steps.issue.outputs.org }}
          GITHUB_HANDLE: ${{ steps.issue.outputs.githubHandle }}
          TEAM_ID: ${{ vars.GITHUB_TEAM_ID }}
        run: |
          dotnet run --file ./scripts/Onboard-ToGitHub.cs -- \
            --organization "$ORGANIZATION" \
            --github-handle "$GITHUB_HANDLE" \
            --team-id "$TEAM_ID"

      - name: Add label - Complete
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
            --add-label "complete" \
            -R ${{ github.event.repository.full_name }}

      - name: Remove label - request
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
            --remove-label "request" \
            -R ${{ github.event.repository.full_name }}

      - name: Comment to issue - Complete
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issueNumber }}
          COMMENT_BODY: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}!

            Your GitHub organization onboarding is complete. Check your notifications and registered email for the steps to join the organization.
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "$GITHUB_REPOSITORY"

          for reaction in '+1' rocket; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/reactions" \
              -f content="$reaction" > /dev/null
          done

      - name: Close issue - Complete
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue close ${{ steps.issue.outputs.issueNumber }} \
            -c "The GitHub organization onboarding request is complete. Closing this issue." \
            -R ${{ github.event.repository.full_name }}

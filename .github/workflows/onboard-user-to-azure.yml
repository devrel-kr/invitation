name: "Workflow: User Onboarding to Azure Subscription"

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number"
        required: true

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  onboard_user:
    name: "Onboard User to Azure Subscription"

    if: |
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, '[Azure subscription onboarding request]') ||
       startsWith(github.event.issue.title, '[Azure 구독 온보딩 요청]'))

    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write

      - name: Check event payload - from issue
        if: |
          github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          ISSUE_PAYLOAD: ${{ toJson(github.event.issue) }}
        run: |
          printf '%s' "$ISSUE_PAYLOAD" > "${{ github.workspace }}/payload.json"

      - name: Check event payload - from workflow_dispatch
        if: |
          github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.inputs.issue-number }}" \
            > "${{ github.workspace }}/payload.json"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Validate Azure subscription request
        id: issue
        shell: bash
        env:
          DUE_DATE: ${{ vars.ONBOARDING_DUE_DATE }}
        run: |
          dotnet run --file ./scripts/Validate-OnboardingRequest.cs -- \
            --request-type azure \
            --input "${{ github.workspace }}/payload.json" \
            --output "${{ github.workspace }}/issue.json" \
            --due-date "$DUE_DATE" \
            --organization "{{ORG_NAME}}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Comment to issue - Acknowledge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issueNumber }}
          COMMENT_BODY: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}!

            Your issue is being reviewed. We will notify you again once we confirm whether it is complete.
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "$GITHUB_REPOSITORY"

          for reaction in '+1' rocket; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/reactions" \
              -f content="$reaction" > /dev/null
          done

      - name: Add a label - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
            --add-label "invalid" \
            -R ${{ github.event.repository.full_name }}

      - name: Comment to issue - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issueNumber }}
          COMMENT_BODY: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}!

            - Submitted at: ${{ steps.issue.outputs.submittedAt }}
            - Due by: ${{ steps.issue.outputs.dueBy }}

            Your request is not valid for the following reasons:

            ${{ steps.issue.outputs.invalidReasons }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "$GITHUB_REPOSITORY"

      - name: Close issue - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue close ${{ steps.issue.outputs.issueNumber }} \
            -c "The submitted request is invalid. Closing this issue." \
            -R ${{ github.event.repository.full_name }}

      - name: Sign in to Azure
        if: |
          steps.issue.outputs.isValid == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Onboard user to Azure subscription
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          USER_EMAIL: ${{ steps.issue.outputs.email }}
          USER_NAME: ${{ steps.issue.outputs.name }}
          SECURITY_GROUP: ${{ vars.AZURE_SECURITY_GROUP }}
        run: |
          dotnet run --file ./scripts/Onboard-ToAzure.cs -- \
            --email "$USER_EMAIL" \
            --name "$USER_NAME" \
            --security-group "$SECURITY_GROUP"

      - name: Add label - Complete
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
          --add-label "complete" \
          -R ${{ github.event.repository.full_name }}

      - name: Remove label - request
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
          --remove-label "request" \
          -R ${{ github.event.repository.full_name }}

      - name: Comment to issue - Complete
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issueNumber }}
          COMMENT_BODY: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}!

            Access instructions have been sent to the email address you provided. Follow those instructions to join the subscription.
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$COMMENT_BODY" \
            --repo "$GITHUB_REPOSITORY"

          for reaction in '+1' rocket; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/reactions" \
              -f content="$reaction" > /dev/null
          done

      - name: Close issue - Complete
        if: |
          steps.issue.outputs.isValid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue close ${{ steps.issue.outputs.issueNumber }} \
            -c "The onboarding request is complete. Closing this issue." \
            -R ${{ github.event.repository.full_name }}

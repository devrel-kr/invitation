name: "Workflow: User Invitation to Azure Subscription"

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number"
        required: true

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  invite_user:
    name: "Invite User to Azure Subscription"

    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '[Azure 구독 초대 요청]')

    runs-on: ubuntu-latest

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: invitation
          permission-contents: read
          permission-issues: write

      - name: Check event payload - from issue
        if: |
          github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          ISSUE_PAYLOAD: ${{ toJson(github.event.issue) }}
        run: |
          printf '%s' "$ISSUE_PAYLOAD" > "${{ github.workspace }}/payload.json"

      - name: Check event payload - from workflow_dispatch
        if: |
          github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.inputs.issue-number }}" \
            > "${{ github.workspace }}/payload.json"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Validate Azure subscription request
        id: issue
        shell: bash
        env:
          DUE_DATE: ${{ vars.INVITATION_DUE_DATE }}
        run: |
          dotnet run --file ./scripts/Validate-InvitationRequest.cs -- \
            --request-type azure \
            --input "${{ github.workspace }}/payload.json" \
            --output "${{ github.workspace }}/issue.json" \
            --due-date "$DUE_DATE" \
            --organization "devrelkorea.org" \
            --github-output "$GITHUB_OUTPUT"

      - name: Comment to issue - Acknowledge
        uses: actions-cool/issues-helper@v3
        with:
          actions: "create-comment"
          token: ${{ steps.bot-token.outputs.token }}
          issue-number: ${{ steps.issue.outputs.issueNumber }}
          emoji: "+1,rocket"
          body: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }} 님!

            생성하신 이슈는 현재 확인 중이며, 완료 여부를 확인한 후 다시 알려드리겠습니다.

      - name: Add a label - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
            --add-label "invalid" \
            -R ${{ github.event.repository.full_name }}

      - name: Comment to issue - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        uses: actions-cool/issues-helper@v3
        with:
          actions: "create-comment"
          token: ${{ steps.bot-token.outputs.token }}
          issue-number: ${{ steps.issue.outputs.issueNumber }}
          body: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }} 님!

            - 요청 시각: ${{ steps.issue.outputs.submittedAt }}
            - 요청 마감 시각: ${{ steps.issue.outputs.dueBy }}

            하지만 제출하신 요청은 다음과 같은 이유로 인해 유효하지 않습니다. 😢

            ${{ steps.issue.outputs.invalidReasons }}

      - name: Close issue - Invalid
        if: |
          steps.issue.outputs.isValid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue close ${{ steps.issue.outputs.issueNumber }} \
            -c "제출한 요청이 유효하지 않습니다. 이슈를 닫습니다." \
            -R ${{ github.event.repository.full_name }}

      - name: Sign in to Azure
        if: |
          steps.issue.outputs.isValid == 'true' &&
          steps.issue.outputs.requestType == 'Azure 구독 초대 요청'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Invite user to Azure tenant
        if: |
          steps.issue.outputs.isValid == 'true' &&
          steps.issue.outputs.requestType == 'Azure 구독 초대 요청'
        shell: bash
        env:
          INVITEE_EMAIL: ${{ steps.issue.outputs.email }}
          INVITEE_NAME: ${{ steps.issue.outputs.name }}
          SECURITY_GROUP: ${{ vars.AZURE_SECURITY_GROUP }}
        run: |
          dotnet run --file ./scripts/Invite-ToAzure.cs -- \
            --email "$INVITEE_EMAIL" \
            --name "$INVITEE_NAME" \
            --security-group "$SECURITY_GROUP"

      - name: Add label - Complete
        if: |
          steps.issue.outputs.isValid == 'true' &&
          steps.issue.outputs.requestType == 'Azure 구독 초대 요청'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
          --add-label "complete" \
          -R ${{ github.event.repository.full_name }}

      - name: Remove label - request
        if: |
          steps.issue.outputs.isValid == 'true' &&
          steps.issue.outputs.requestType == 'Azure 구독 초대 요청'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue edit ${{ steps.issue.outputs.issueNumber }} \
          --remove-label "request" \
          -R ${{ github.event.repository.full_name }}

      - name: Comment to issue - Complete
        if: |
          steps.issue.outputs.isValid == 'true' &&
          steps.issue.outputs.requestType == 'Azure 구독 초대 요청'
        uses: actions-cool/issues-helper@v3
        with:
          actions: "create-comment"
          token: ${{ steps.bot-token.outputs.token }}
          issue-number: ${{ steps.issue.outputs.issueNumber }}
          emoji: "+1,rocket"
          body: |
            👋🏼 @${{ steps.issue.outputs.githubHandle }}님!

            입력하신 이메일 주소로 초대장을 발송했습니다. 초대장을 수락하면 조직에 참여할 수 있습니다. 감사합니다!

      - name: Close issue - Complete
        if: |
          steps.issue.outputs.isValid == 'true' &&
          steps.issue.outputs.requestType == 'Azure 구독 초대 요청'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          gh issue close ${{ steps.issue.outputs.issueNumber }} \
            -c "초대 요청을 완료했습니다. 이슈를 닫습니다." \
            -R ${{ github.event.repository.full_name }}
